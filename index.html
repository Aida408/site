<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Odyssey — Team Building Invitation</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Cormorant+Garamond:wght@400;600&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ An invitation for you ♡</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Will you come to the TB?</h1>

        <!-- Стикер и кот в один ряд -->
        <div class="media-row">
          <video id="letter-sticker" class="sticker" autoplay muted loop playsinline>
            <source src="sticker.webm" type="video/webm" />
          </video>
          <img src="cat_heart.gif" class="cat" id="letter-cat" alt="" />
        </div>

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <!-- Показывается после нажатия Yes -->
        <div id="final-text" class="final-text" style="display: none">
          <p class="final-kicker">Your voyage begins</p>
          <h2 class="final-heading">The Odyssey</h2>

          <video id="final-video" class="final-video" muted loop playsinline>
            <source src="the-odyssey-batman.mp4" type="video/mp4" />
          </video>

          <p class="final-lead">
            <span class="lead-icon">🚀</span> Calling all newbies and everyone
            else! Join us for an epic Odyssey-style team building!
          </p>
          <ul class="final-details">
            <li><span class="detail-icon">📍</span><span>Room 7.105</span></li>
            <li><span class="detail-icon">🕕</span><span>6:00 PM</span></li>
          </ul>
          <p class="final-sign">See you there! 🎉</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
